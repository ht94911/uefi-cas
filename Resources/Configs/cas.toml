[boot_shim]
requires_kernel_header = true
text_offset = 0x80000
source = "BootShim/CasBootShim.S"
validator = "BootShim/CasBootValidate.c"
linker = "BootShim/CasBootShim.lds"

[uefi_fd]
base = 0x9f000000
size = 0x800000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = false

[boot_image_dtb]
# Original cas SoC DTB2 is data only; ABL applies the phone's existing DTBO.
# The raw input is kept outside Git and supplied explicitly to the packer.
source = "stock-soc-dtb"
source_bytes = 536890
source_sha256 = "0eae9bf6a42b38ce8490f100ff24a681f50a67da53b8dd366ef7e6e119a59963"
prepared_sha256 = "414deae1dc24634bb9a06f8ffefa050658de1e35205879e4d405283e3c7277ab"
padding = 8192

[boot_image]
header_version = 2
pagesize = 4096
base = 0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
dtb_offset = 0x1f00000
tags_offset = 0x1e00000
cmdline = ""
