[boot_shim]
requires_kernel_header = true
text_offset = 0x80000
source = "BootShim/CasBootShim.S"
validator = "BootShim/CasBootValidate.c"
linker = "BootShim/CasBootShim.lds"

[uefi_fd]
base = 0x9f000000
size = 0x800000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = false

[boot_image_dtb]
# Preserve the B-01 expansion area for ABL memory/chosen/splash updates.
padding = 8192

[boot_image]
header_version = 2
pagesize = 4096
base = 0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
dtb_offset = 0x1f00000
tags_offset = 0x1e00000
cmdline = ""
